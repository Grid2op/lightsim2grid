name: Release check

# Runs only on pull requests into master, i.e. on releases. Make the three jobs
# required in master's branch protection, otherwise they are only advisory.
# The procedure they enforce is in RELEASE.md.
on:
  pull_request:
    branches:
      - master
    # "edited": ticking a box of the checklist reruns the checklist job.
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  versions:
    name: Version and changelog
    # A description edit changes nothing this job reads.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Final version, dated and sorted changelog
        run: python3 utils/release.py check

  checklist:
    name: Release checklist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to put the checklist in a description that lacks it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Only the script and the template are read.
          sparse-checkout: |
            utils/release.py
            .github/PULL_REQUEST_TEMPLATE/release.md
          sparse-checkout-cone-mode: false
      # A pull request opened without ?template=release.md gets the checklist appended
      # to its description, so nobody has to remember the template. The job still
      # fails: the boxes are not ticked yet.
      - name: Add the checklist if missing
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if ! printf '%s' "$PR_BODY" | grep -q '<!-- release-checklist -->'; then
            if [ "$SAME_REPO" = "true" ]; then
              { printf '%s\n\n' "$PR_BODY"; cat .github/PULL_REQUEST_TEMPLATE/release.md; } > body.md
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file body.md
              echo "::notice::Release checklist added to the pull request description."
            fi
          fi
      - name: Every box ticked, release notes and announcement written
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | python3 utils/release.py check-pr-body

  docs:
    name: Docs build without warnings
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # The same as .readthedocs.yml, so that a clean build here is a clean build there.
          python-version: "3.10"
      - name: Fetch the vendored dependencies
        run: git submodule update --init --depth 1 eigen SuiteSparse
      - name: Install the package with the docs extra (as Read the Docs does)
        run: python -m pip install ".[docs]"
      - name: Build the docs, every warning an error
        working-directory: docs
        run: python -m sphinx -b html -W --keep-going . _build/html
