name: Release check

# Runs only on pull requests into master, i.e. on releases. Make its two jobs, and the
# one of release_checklist.yml, required in master's branch protection, otherwise they
# are only advisory. The procedure they enforce is in RELEASE.md.
#
# The checklist is a separate workflow on purpose: it reruns on every edit of the
# description, and a job skipped on such an edit would count as passed for a required
# check, hiding a failing version or docs job of the same commit.
on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  versions:
    name: Version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Final version, dated and sorted changelog
        run: python3 utils/release.py check

  docs:
    name: Docs build without warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # The same as .readthedocs.yml, so that a clean build here is a clean build there.
          python-version: "3.10"
      - name: Fetch the vendored dependencies
        run: git submodule update --init --depth 1 eigen SuiteSparse
      - name: Install the package with the docs extra (as Read the Docs does)
        run: python -m pip install ".[docs]"
      - name: Build the docs, every warning an error
        working-directory: docs
        run: python -m sphinx -b html -W --keep-going . _build/html
